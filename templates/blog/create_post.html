{% extends 'base.html' %}
{% block title %}
    Create Post
{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <p>
    <input type="text" name="post_title"
           placeholder="Post Title"
           required>
    </p>
    <p>
    <input type="text" name="post_title_tag"
           placeholder="Title Tag"
           required>
    </p>
    <p>
    <input type="text" name="post_author"
           placeholder="Author"
           required>
    </p>
    <p>
    <input type="text" name="post_body"
           placeholder="Body"
           required>
    </p>
    <p>
    <input type="text" name="post_category"
           placeholder="Category Name"
           required>
    </p>    
    <input type="text" name="post_snippet"
           placeholder="Snippet"
           required>
    </p>
</form>
    <button type="submit">Create</button>
{% endblock %}
